server:
  port: 8084

spring:
  application:
    name: broker-service

  datasource:
    url: jdbc:mysql://localhost:3306/kafka_pedidos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: kafka_user
    password: kafka_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: broker-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  correlation-id:
    header: X-Correlation-Id
  kafka:
    timeout-ms: 5000
    retry:
      max-attempts: 3
      initial-delay-ms: 500
      multiplier: 2.0
    topics:
      client-create: client-create
      client-create-dlt: client-create-dlt
      client-response: client-response
      client-response-dlt: client-response-dlt
  database:
    timeout-ms: 5000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
