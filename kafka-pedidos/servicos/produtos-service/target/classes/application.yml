server:
  port: 8082

spring:
  application:
    name: produtos-service

  datasource:
    url: jdbc:mysql://localhost:3306/kafka_pedidos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: kafka_user
    password: kafka_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: produtos-service
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  correlation-id:
    header: X-Correlation-Id
  redis:
    ttl-minutes: 60
    timeout-ms: 2000
    retry:
      max-attempts: 3
      initial-delay-ms: 500
      multiplier: 2.0
  cache:
    produtos:
      refresh-minutes: 30
  kafka:
    timeout-ms: 5000
  database:
    timeout-ms: 5000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
