name: kafka-pedidos

services:
  mysql:
    image: mysql:8.0
    container_name: kafka-pedidos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kafka_pedidos
      MYSQL_USER: kafka_user
      MYSQL_PASSWORD: kafka_pass
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - kafka-pedidos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: kafka-pedidos-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: America/Sao_Paulo
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - kafka-pedidos
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-pedidos-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      TZ: America/Sao_Paulo
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka/create-topics.sh:/opt/kafka/create-topics.sh:ro
    networks:
      - kafka-pedidos
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    container_name: kafka-pedidos-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - kafka-pedidos
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-pedidos-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-pedidos
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - kafka-pedidos
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis-insight:
    image: redis/redisinsight:2.54.0
    container_name: kafka-pedidos-redis-insight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_APP_PORT: 5540
      TZ: America/Sao_Paulo
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - kafka-pedidos
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5540/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  sonarqube:
    image: sonarqube:10.4.1-community
    container_name: kafka-pedidos-sonarqube
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      TZ: America/Sao_Paulo
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - ./sonarqube/conf/sonar.properties:/opt/sonarqube/conf/sonar.properties:ro
    networks:
      - kafka-pedidos
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

networks:
  kafka-pedidos:
    name: kafka-pedidos
    driver: bridge

volumes:
  mysql_data:
    name: kafka-pedidos-mysql-data
  zookeeper_data:
    name: kafka-pedidos-zookeeper-data
  zookeeper_log:
    name: kafka-pedidos-zookeeper-log
  kafka_data:
    name: kafka-pedidos-kafka-data
  redis_data:
    name: kafka-pedidos-redis-data
  redis_insight_data:
    name: kafka-pedidos-redis-insight-data
  sonarqube_data:
    name: kafka-pedidos-sonarqube-data
  sonarqube_extensions:
    name: kafka-pedidos-sonarqube-extensions
  sonarqube_logs:
    name: kafka-pedidos-sonarqube-logs
