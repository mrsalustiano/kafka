# Configuração de referência Kafka (skill kafka-pedidos)
# As propriedades abaixo são aplicadas via variáveis de ambiente no docker-compose.yml

broker.id=1
zookeeper.connect=zookeeper:2181

listeners=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
advertised.listeners=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0

auto.create.topics.enable=false
log.retention.hours=168
log.segment.bytes=1073741824
num.partitions=3
default.replication.factor=1

# Tópicos da aplicação (criados via kafka/create-topics.sh):
# - client-create
# - client-response
# - pedido-create
# - pedido-response
# - client-create-dlt
# - pedido-create-dlt
