# Configuração Redis (skill kafka-pedidos)
# TTL de cache da aplicação: 60 minutos (configurado nos microsserviços)

bind 0.0.0.0
port 6379
protected-mode no

timeout 0
tcp-keepalive 300

maxmemory 256mb
maxmemory-policy allkeys-lru

save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec

dir /data

loglevel notice

# Chaves utilizadas pela aplicação:
# produto:{id}
# produto:all
